name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Build Android APK
        run: flet build apk --app-title "EMGE Trade" --icon icon.png main.py

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: emge-trade-apk
          path: build/apk/*.apk
          
